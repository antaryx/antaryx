<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="core stack: Python, Go, Docker, Bash, Django, Linux / WSLg, Git">
<title>core stack: Python, Go, Docker, Bash, Django, Linux / WSLg, Git</title>
<defs>
  <style>
    text { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    @keyframes tw { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes fade { from { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } }
    @keyframes draw { from { stroke-dasharray: var(--l); stroke-dashoffset: var(--l) } to { stroke-dashoffset: 0 } }
    @keyframes ripple { from { transform: scale(.4); opacity: .9 } to { transform: scale(2.6); opacity: 0 } }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes scan { from { transform: translateY(-80px) } to { transform: translateY(520px) } }
    @keyframes type { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    .tw { animation: tw 3.2s ease-in-out infinite }
    .cur { animation: blink 1s steps(1) infinite }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3.4s ease-out infinite }
    .scan { animation: scan 9s linear infinite }
    /* reduced motion removes the sweeping and sliding movement (scan bar, ripples, slide-up) but keeps the gentle animation: twinkle, fade-in,
       line drawing, typing and the cursor. A visitor whose browser asks for "no animation at all" used to get a static picture. */
    @media (prefers-reduced-motion: reduce) { .scan, .ripple { animation: none !important } [style*="animation:rise"] { animation-name: fade !important } }
  </style>
  <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa8ff"/><stop offset="1" stop-color="#5ccfe6"/></linearGradient>
  <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a98f0"/><stop offset=".55" stop-color="#6aa8ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <radialGradient id="sg"><stop offset="0" stop-color="#d7f4fb" stop-opacity=".9"/><stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="ag"><stop offset="0" stop-color="#ff6b81" stop-opacity=".95"/><stop offset="1" stop-color="#ff6b81" stop-opacity="0"/></radialGradient>
  <radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#151b21"/><stop offset="1" stop-color="#0b0f12"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ccfe6" stop-opacity="0"/><stop offset=".5" stop-color="#5ccfe6" stop-opacity=".10"/><stop offset="1" stop-color="#5ccfe6" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="sk"><rect x="1" y="1" width="1198" height="90" rx="18"/></clipPath></defs>
