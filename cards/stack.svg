imation:fade .5s ease-out 1.10s backwards"><rect x="735.6" y="42" width="73.8" height="34" rx="17" fill="none" stroke="#5ccfe6" stroke-opacity=".85"/><circle cx="754.6" cy="59" r="3.5" fill="#6aa8ff"/><text x="767.6" y="64" font-size="16" fill="#e6edf3">Git</text></g></g>
