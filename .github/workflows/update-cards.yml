# Redraws the profile cards (scripts/render_cards.py) once a week and commits them when something changed.
# Hardened on purpose: the only action is actions/checkout, pinned by commit SHA; the token can write contents and nothing else; the
# script is Python standard library only and reads public GitHub data.
name: update-cards

on:
  schedule:
    - cron: "17 5 * * 1"      # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/render_cards.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- cards; then
            echo "cards unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cards
            git commit -m "cards: weekly redraw"
            git push
          fi
